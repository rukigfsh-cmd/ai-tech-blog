title: AIテックラボ
description: AI・ガジェット・テクノロジーの使い方を、調べて確かめてわかりやすく解説するブログ
url: "https://rukigfsh-cmd.github.io"
baseurl: "/ai-tech-blog"

lang: ja
locale: ja_JP
timezone: Asia/Tokyo
encoding: utf-8

# テーマ（GitHub Pages対応）
theme: minima

# プラグイン（GitHub Pages で使えるものだけ）
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Minima設定
minima:
  skin: auto
  date_format: "%Y年%m月%d日"

# ヘッダーのメニュー
header_pages:
  - archive.html
  - about.md
  - privacy.md
  - contact.md

# 公開しないファイル（稼ぎエンジンの運用ファイルはサイトに出さない）
exclude:
  - automation
  - hq
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - "*.bat"
  - "*.py"

# SEO設定
author:
  name: AIテックラボ編集部

social:
  name: AIテックラボ

# 記事の既定値
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: AIテックラボ編集部

# Analytics（後で追加）
google_analytics: ""

# AdSense（独自ドメイン取得・審査通過後に設定）
adsense_publisher_id: ""
adsense_ad_slot: ""
