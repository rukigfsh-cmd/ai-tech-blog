<title>稼ぎエンジン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: one-screen app — sticky top bar, one scrolling view, fixed bottom tab bar.
   Concept: 通帳（passbook paper, ledger numerals）× 伝票（task slips stamped 済 in 朱）. */
:root {
  --paper: #ECEFE8;
  --sheet: #FAFBF7;
  --ink: #16202B;
  --ink-2: #4D5866;
  --ink-3: #6F7A88;
  --rule: #CBD3C8;
  --rule-2: #DFE4DB;
  --ai: #22407E;
  --ai-ink: #FFFFFF;
  --ai-soft: #DFE6F4;
  --bar: #B7C4E2;
  --shu: #BF3F2A;
  --on-shu: #FFFFFF;
  --gain: #1C7A4B;
  --gain-soft: #DCEFE3;
  --warn: #93600F;
  --warn-soft: #F4E8D2;
  --line: rgba(34, 64, 126, 0.07);
  --f-display: "Dela Gothic One", "BIZ UDPGothic", "Hiragino Sans", system-ui, sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --f-num: "BIZ UDGothic", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E131A; --sheet: #151C25; --ink: #E4E9EF; --ink-2: #A3AEBC; --ink-3: #8794A5;
    --rule: #2A3443; --rule-2: #202937; --ai: #93ADF3; --ai-ink: #0E131A; --ai-soft: #1D2942; --bar: #34466E;
    --shu: #F2826B; --on-shu: #1A0E0B; --gain: #5BC88D; --gain-soft: #15301F; --warn: #E3A84C; --warn-soft: #33270F;
    --line: rgba(147, 173, 243, 0.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E131A; --sheet: #151C25; --ink: #E4E9EF; --ink-2: #A3AEBC; --ink-3: #8794A5;
  --rule: #2A3443; --rule-2: #202937; --ai: #93ADF3; --ai-ink: #0E131A; --ai-soft: #1D2942; --bar: #34466E;
  --shu: #F2826B; --on-shu: #1A0E0B; --gain: #5BC88D; --gain-soft: #15301F; --warn: #E3A84C; --warn-soft: #33270F;
  --line: rgba(147, 173, 243, 0.06);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--ai); }
h1, h2, h3 { text-wrap: balance; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.topbar-in {
  max-width: 680px; margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark {
  width: 30px; height: 30px; flex: none;
  border: 2px solid var(--shu); color: var(--shu); border-radius: 6px;
  display: grid; place-items: center;
  font: 17px/1 var(--f-display); transform: rotate(-5deg);
}
.brand-name { font: 19px/1 var(--f-display); letter-spacing: 0.02em; white-space: nowrap; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; line-height: 1; padding: 6px 10px; border-radius: 999px;
  background: var(--rule-2); color: var(--ink-2); white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--gain-soft); color: var(--gain); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ai { background: var(--ai-soft); color: var(--ai); }
.pill.off::before { opacity: 0.5; }

/* Main */
main {
  max-width: 680px; margin: 0 auto;
  padding-block: 18px calc(var(--tabbar-h) + 28px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.v-title { font: 24px/1.25 var(--f-display); margin: 4px 0 6px; letter-spacing: 0.02em; }
.v-lead { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; }
.sec {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  margin: 28px 0 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-2);
}
.sec:first-child { margin-top: 0; }
.stack { display: grid; gap: 10px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; }
.sub { font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.06em; margin-bottom: 4px; }
.meta { font-size: 12.5px; color: var(--ink-3); }
.foot { margin: 28px 0 0; text-align: center; font-size: 12px; color: var(--ink-3); }
.link {
  appearance: none; background: none; border: 0; padding: 4px 0; cursor: pointer;
  color: var(--ai); font-size: 13.5px; font-weight: 700; text-decoration: none;
}
.grid-gap { display: grid; gap: 8px; }

/* Ledger (passbook) */
.ledger {
  position: relative; overflow: hidden;
  background-color: var(--sheet);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px);
  border: 1px solid var(--rule); border-radius: var(--r);
  padding: 16px 18px 12px;
}
.ledger-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); letter-spacing: 0.08em; }
.amount {
  font-family: var(--f-num); font-weight: 700; font-variant-numeric: tabular-nums;
  font-size: clamp(36px, 12vw, 50px); line-height: 1.15; letter-spacing: -0.01em; margin-top: 4px;
}
.amount .yen { font-size: 0.55em; color: var(--ink-2); margin-right: 3px; }
.ledger-row { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.ledger-row b { font-family: var(--f-num); color: var(--ink); }
.progress { height: 6px; border-radius: 3px; background: var(--rule-2); margin-top: 10px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--gain); }
.months { display: block; width: 100%; height: auto; margin-top: 10px; }
.months .bar { fill: var(--bar); }
.months .bar.now { fill: var(--ai); }
.months .axis { stroke: var(--rule); stroke-width: 1; }
.months text { fill: var(--ink-3); font-family: var(--f-num); font-size: 10px; }
.months text.val { fill: var(--ink); font-weight: 700; }

/* Your turn */
.turn-sum { margin: 0 0 8px; font-size: 14px; color: var(--ink-2); }
.turn-sum b { font-family: var(--f-num); font-size: 20px; color: var(--ink); }
.turn-list { list-style: none; margin: 0; padding: 0; display: grid; }
.turn-item {
  appearance: none; width: 100%; background: none; border: 0; border-top: 1px dashed var(--rule);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 10px 0; text-align: left; cursor: pointer;
}
.turn-title { font-weight: 700; font-size: 14.5px; min-width: 0; }

/* Slip (task) */
.slip {
  position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r);
  padding: 14px 14px 12px 30px;
}
.slip::before { content: ""; position: absolute; left: 15px; top: 12px; bottom: 12px; border-left: 2px dotted var(--rule); }
.slip.is-done, .slip.is-skipped { background: transparent; }
.slip.is-skipped h3 { color: var(--ink-2); }
.slip-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; padding-right: 54px; }
.slip h3, .idea h3 { font-size: 16px; line-height: 1.45; margin: 2px 0 4px; }
.why { font-size: 13.5px; color: var(--ink-2); margin: 0 0 4px; }
.kind {
  font-size: 11px; font-weight: 700; line-height: 1; letter-spacing: 0.1em; white-space: nowrap;
  color: var(--ai); border: 1.5px solid var(--ai); border-radius: 3px; padding: 3px 4px 3px 5px;
}
.chip {
  font-family: var(--f-num); font-size: 12px; line-height: 1; white-space: nowrap;
  color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 8px;
}
.chip.good { color: var(--gain); background: var(--gain-soft); border-color: transparent; font-family: var(--f-body); white-space: normal; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.stamp {
  position: absolute; right: 14px; top: 12px; width: 56px; height: 56px;
  border: 3px solid var(--shu); color: var(--shu); border-radius: 50%;
  display: grid; place-items: center; font: 25px/1 var(--f-display);
  transform: rotate(-14deg); opacity: 0.88; pointer-events: none;
}
.stamp.anim { animation: stamp 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes stamp { from { transform: scale(1.9) rotate(-2deg); opacity: 0; } to { transform: scale(1) rotate(-14deg); opacity: 0.88; } }
.details { margin-top: 10px; border-top: 1px dashed var(--rule); padding-top: 12px; display: grid; gap: 14px; }
.steps { margin: 0; padding-left: 1.35em; }
.steps li { margin: 3px 0; font-size: 14px; }
.copyrow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start;
  background: var(--paper); border-radius: 8px; padding: 8px 8px 8px 10px;
}
.copyrow .lbl { font-size: 11px; color: var(--ink-3); }
.copyrow .txt { font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.linkrow { display: flex; flex-wrap: wrap; gap: 8px; }
.answer { background: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.warnline { flex-basis: 100%; margin: 0; font-size: 13.5px; color: var(--warn); }

/* Buttons & fields */
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.btn {
  appearance: none; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 10px 14px; border-radius: 10px;
  font-size: 14px; font-weight: 700; line-height: 1.2;
  border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
}
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--ai-ink); }
.btn.danger { background: transparent; border-color: var(--shu); color: var(--shu); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 7px 11px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .link:focus-visible, .turn-item:focus-visible, .seg button:focus-visible,
input:focus-visible, textarea:focus-visible, select:focus-visible, .pb-row:focus-visible, .chipbtn:focus-visible {
  outline: 2px solid var(--ai); outline-offset: 2px;
}
.f { display: grid; gap: 5px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.f.wide { grid-column: 1 / -1; flex-basis: 100%; }
input, textarea, select {
  width: 100%; min-width: 0;
  font-size: 16px; line-height: 1.45;
  background: var(--sheet); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px;
}
textarea { min-height: 88px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 380px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }

/* Segmented control */
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px;
  background: var(--rule-2); border-radius: 10px; padding: 3px; margin-bottom: 14px;
}
.seg button {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  padding: 9px 2px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }
.seg .n { font-family: var(--f-num); font-weight: 400; margin-left: 3px; }

/* One-tap choices */
.choices { display: grid; gap: 8px; margin-top: 12px; }
.btn.choice { justify-content: space-between; text-align: left; width: 100%; min-height: 50px; font-size: 15px; }
.rec { flex: none; font-size: 11px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 999px; background: var(--ai-ink); color: var(--ai); }
.subacts { display: flex; flex-wrap: wrap; gap: 2px 18px; margin-top: 6px; }
.subacts .link { font-size: 13px; font-weight: 400; color: var(--ink-3); }
.autopilot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.autopilot .link { flex: none; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); grid-column: 1 / -1; }
.toggle input { width: 22px; height: 22px; flex: none; accent-color: var(--ai); }

/* Ideas */
.idea { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; }
.idea-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.score { display: flex; align-items: center; gap: 10px; margin: 6px 0 8px; }
.score .sub { margin: 0; }
.score .track { flex: 1; height: 6px; background: var(--rule-2); border-radius: 3px; overflow: hidden; }
.score .track i { display: block; height: 100%; background: var(--ai); }
.score b { font-family: var(--f-num); font-size: 16px; min-width: 2em; text-align: right; }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 10px 0 4px; }
@media (max-width: 420px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.metric { background: var(--paper); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.metric .k { font-size: 11px; color: var(--ink-3); }
.metric .v { font-family: var(--f-num); font-weight: 700; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
.kv { margin: 8px 0 0; font-size: 13.5px; }
.kv .sub { display: block; }
.sources { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 13px; }
.sources .sub { flex-basis: 100%; margin: 0; }
.sources a { overflow-wrap: anywhere; }

/* Passbook */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sumcell { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.sumcell .k { font-size: 11.5px; color: var(--ink-3); }
.sumcell .v { font-family: var(--f-num); font-weight: 700; font-size: clamp(15px, 4.6vw, 19px); overflow-wrap: anywhere; }
.bars { display: grid; gap: 8px; }
.bars .row { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.bars .track { height: 10px; background: var(--rule-2); border-radius: 5px; overflow: hidden; }
.bars .track i { display: block; height: 100%; background: var(--gain); border-radius: 5px; }
.bars .num { font-family: var(--f-num); font-weight: 700; }
.passbook { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.pb-head, .pb-row {
  display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; gap: 10px; align-items: start;
  padding: 9px 12px;
}
.pb-head { font-size: 11px; letter-spacing: 0.08em; color: var(--ink-3); background: var(--paper); border-bottom: 2px solid var(--ink); }
.pb-head span:last-child { text-align: right; }
.pb-row {
  width: 100%; appearance: none; background: none; border: 0; border-bottom: 1px solid var(--rule-2);
  text-align: left; cursor: pointer; font-size: 13.5px;
}
.pb-date { font-family: var(--f-num); color: var(--ink-2); }
.pb-desc { min-width: 0; overflow-wrap: anywhere; }
.pb-desc small { display: block; color: var(--ink-3); font-size: 12px; }
.pb-amt { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.pb-amt b { display: block; color: var(--gain); }
.pb-amt small { color: var(--ink-3); font-size: 11.5px; }
.pb-month { padding: 5px 12px; font-size: 11.5px; letter-spacing: 0.08em; color: var(--ai); background: var(--ai-soft); }
.pb-del { padding: 8px 12px 12px; border-bottom: 1px solid var(--rule-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Channels, runs, messages */
.ch-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--rule); }
.ch-row:first-child { border-top: 0; padding-top: 0; }
.ch-row:last-child { padding-bottom: 0; }
.ch-name { font-weight: 700; font-size: 14px; min-width: 0; }
.ch-name small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.ch-side { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.ch-metric { font-family: var(--f-num); font-size: 12.5px; color: var(--ink-2); }
.strategy { white-space: pre-wrap; font-size: 14px; }
.run h3 { font-size: 15.5px; margin: 6px 0 6px; line-height: 1.45; }
.run ul { margin: 0; padding-left: 1.2em; font-size: 13.5px; }
.run li { margin: 2px 0; }
.run .issues li { color: var(--warn); }
.run-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.msg { display: grid; gap: 6px; }
.bubble { max-width: 88%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
.bubble.me { justify-self: end; background: var(--ai); color: var(--ai-ink); border-bottom-right-radius: 4px; }
.bubble.ai { justify-self: start; background: var(--sheet); border: 1px solid var(--rule); border-bottom-left-radius: 4px; }
.bubble-meta { font-size: 11.5px; color: var(--ink-3); }
.bubble-meta.me { justify-self: end; }
.chat { display: grid; gap: 8px; margin-bottom: 12px; }
.chipbtn {
  appearance: none; cursor: pointer; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  border-radius: 999px; padding: 8px 12px; font-size: 13px;
}
.suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.composer { display: grid; gap: 8px; }
.composer .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.okline { color: var(--gain); font-size: 13.5px; margin: 10px 0 0; }
.errline { color: var(--shu); font-size: 13.5px; margin: 10px 0 0; }

/* States */
.empty {
  text-align: center; color: var(--ink-2); font-size: 13.5px;
  padding: 26px 16px; border: 1.5px dashed var(--rule); border-radius: var(--r);
}
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; font-size: 13.5px; }
.notice b { display: block; color: var(--warn); }
.skel { height: 74px; border-radius: var(--r); background: var(--rule-2); opacity: 0.6; }
.skel + .skel { margin-top: 10px; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--sheet); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar-in { max-width: 680px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font-size: 11px; font-weight: 700;
}
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--ai); }
.tab[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ai);
}
.badge {
  position: absolute; top: 5px; left: calc(50% + 5px);
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--shu); color: var(--on-shu);
  font: 700 11px/18px var(--f-num); text-align: center;
}

#toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%); z-index: 20; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px;

}

  #toast { transition: none; }
}
</style>

<script>
(function () {
  "use strict";

  // ---------- constants ----------
  var VIEWS = ["home", "tasks", "ideas", "money", "claude"];
  var KIND = { account: "登録", listing: "出品", decision: "判断", review: "確認", input: "入力", other: "作業" };
  var IDEA_STATUS = { proposed: "承認待ち", approved: "承認済み", active: "進行中", paused: "一時停止", rejected: "見送り", done: "完了" };
  var RISK = { low: "低", mid: "中", high: "高" };
  var CH_STATUS = { active: "稼働中", setup: "準備中", idea: "構想", paused: "停止中" };
  var RUN_KIND = { daily: "日次", weekly: "週次", manual: "手動", setup: "初期設定" };
  var RUN_STATUS = { ok: "完了", partial: "一部完了", error: "失敗" };
  var MSG_STATUS = { "new": "Claude未確認", seen: "確認済み", done: "対応済み" };
  var SOURCES = ["Amazonアソシエイト", "楽天アフィリエイト", "A8.net", "もしもアフィリエイト", "Google AdSense", "BOOTH", "note", "ココナラ", "Kindle", "その他"];
  var SERVER = "Claude Code Remote";
  var TZ = "Asia/Tokyo";
  var ICONS = {
    home: '<path d="M3.5 11.5 12 4.5l8.5 7"/><path d="M5.8 10v9.5h12.4V10"/><path d="M10 19.5v-5h4v5"/>',
    tasks: '<rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="m8.2 9.2 1.6 1.6 3.4-3.4"/><path d="M8.5 15h7"/>',
    ideas: '<path d="M9.2 18h5.6"/><path d="M10.2 21h3.6"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.3 1 2.2h5.2c0-.9.4-1.7 1-2.2A6 6 0 0 0 12 3z"/>',
    money: '<path d="M6.5 4 12 11.5 17.5 4"/><path d="M12 11.5V20"/><path d="M7.5 13.2h9"/><path d="M7.5 16.6h9"/>',
    claude: '<path d="M4 5.5h16v10.5H9.5L5 19.8V16H4z"/><path d="M8.6 10.8h.01M12 10.8h.01M15.4 10.8h.01"/>'
  };

  // ---------- state ----------
  var S = {
    view: "home", taskFilter: "todo", ideaFilter: "proposed", claudeTab: "ask",
    tasks: [], ideas: [], revenue: [], runs: [], messages: [], products: [],
    state: null, profile: null,
    loaded: {}, ready: false, slow: false, noDb: false, dbError: "",
    db: null, user: null, mcp: null, sample: null, downloads: null,
    sampleDisabled: false, notOwner: false,
    expanded: new Set(), collapsed: new Set(), pending: new Set(), confirmEmpty: new Set(), skipAsk: new Set(),
    drafts: {}, chat: [], chatBusy: false, chatLive: "", chatCtl: null, chatError: "",
    runBusy: false, runMsg: null, sched: null, schedBusy: false
  };

  // ---------- utils ----------
  var dayFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  var dtFmt = new Intl.DateTimeFormat("ja-JP", { timeZone: TZ, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  var numFmt = new Intl.NumberFormat("ja-JP");
  function today() { return dayFmt.format(new Date()); }
  function addDays(ymd, n) { return dayFmt.format(new Date(Date.parse(ymd + "T12:00:00+09:00") + n * 86400000)); }
  function nowIso() { return new Date().toISOString(); }
  function fmtNum(n) { return numFmt.format(Math.round(Number(n) || 0)); }
  function fmtYen(n) { return "¥" + fmtNum(n); }
  function fmtShort(n) { n = Number(n) || 0; return n >= 10000 ? (Math.round(n / 1000) / 10) + "万" : fmtNum(n); }
  function md(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? (+m[2]) + "/" + (+m[3]) : ""; }
  function dt(iso) { var d = new Date(iso); return isNaN(d) ? "" : dtFmt.format(d); }
  function ago(iso) {
    var t = Date.parse(iso); if (isNaN(t)) return "";
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "たった今"; if (m < 60) return m + "分前";
    var hr = Math.round(m / 60); if (hr < 24) return hr + "時間前";
    return Math.round(hr / 24) + "日前";
  }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function safeUrl(u) { u = String(u || ""); return /^https?:\/\//i.test(u) ? u : null; }
  function hostOf(u) { try { return new URL(u).hostname; } catch (e) { return u; } }
  function rangeYen(lo, hi) {
    var a = Number(lo), b = Number(hi);
    if (isNaN(a) && isNaN(b)) return "—";
    if (isNaN(b) || a === b) return fmtYen(a);
    return fmtShort(a) + "〜" + fmtShort(b) + "円";
  }
  function byScore(a, b) { return (Number(b.score) || 0) - (Number(a.score) || 0); }
  function str(v) { return v == null ? "" : String(v); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function $(sel) { return document.querySelector(sel); }

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === "class") el.className = v;
        else if (k === "style") el.style.cssText = v;
        else if (k === "value") el.value = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(el, k); }); return; }
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  function svg(tag, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, String(attrs[k])); });
    return el;
  }
  function field(tag, id, initial, attrs) {
    var p = Object.assign({ id: id }, attrs || {});
    var el = h(tag, p);
    el.value = S.drafts[id] != null ? S.drafts[id] : str(initial);
    el.addEventListener("input", function () { S.drafts[id] = el.value; });
    return el;
  }
  function selectField(id, options, initial) {
    var el = h("select", { id: id }, options.map(function (o) { return h("option", { value: o }, o); }));
    el.value = S.drafts[id] != null ? S.drafts[id] : initial;
    el.addEventListener("change", function () { S.drafts[id] = el.value; });
    return el;
  }
  function draft(id, fallback) { return S.drafts[id] != null ? S.drafts[id] : str(fallback); }
  function clearDraft(id) { delete S.drafts[id]; }

  var toastTimer = 0;
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function reducedMotion() { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } }

  // ---------- derived ----------
  function isOpen(t) { return !t.status || t.status === "todo" || (t.status === "snoozed" && str(t.snoozeUntil) <= today()); }
  function isSnoozed(t) { return t.status === "snoozed" && str(t.snoozeUntil) > today(); }
  function taskSort(a, b) {
    return (Number(a.priority) || 2) - (Number(b.priority) || 2)
      || str(a.due || "9999").localeCompare(str(b.due || "9999"))
      || ((Number(b.valueYen) || 0) / (Number(b.minutes) || 10) - (Number(a.valueYen) || 0) / (Number(a.minutes) || 10))
      || str(a.createdAt).localeCompare(str(b.createdAt));
  }
  function openTasks() { return S.tasks.filter(isOpen).sort(taskSort); }
  function monthOf(ymd) { return str(ymd).slice(0, 7); }
  function prevMonth(ym) { return addDays(ym + "-01", -1).slice(0, 7); }
  function revenueStats() {
    var tm = monthOf(today()), lm = prevMonth(tm);
    var r = { tm: tm, lm: lm, thisM: 0, lastM: 0, total: 0, byMonth: {}, bySource: {} };
    S.revenue.forEach(function (x) {
      var a = Number(x.amount) || 0, k = monthOf(x.date);
      r.total += a; r.byMonth[k] = (r.byMonth[k] || 0) + a;
      if (k === tm) { r.thisM += a; var s = x.source || x.channel || "その他"; r.bySource[s] = (r.bySource[s] || 0) + a; }
      if (k === lm) r.lastM += a;
    });
    return r;
  }

  // ---------- db writes ----------
  function dbErrorText(e) {
    var c = e && e.code;
    return ({
      invalid_argument: "保存できませんでした。入力内容を確かめてください",
      quota_exceeded: "保存できる量の上限です。古い記録を消してください",
      resource_exhausted: "操作が続きすぎました。少し待ってからもう一度",
      revoked: "アクセス権が変わりました。開き直してください",
      unavailable: "通信が不安定です。もう一度お試しください"
    })[c] || "保存できませんでした。もう一度お試しください";
  }
  function write(key, fn, okMsg) {
    if (!S.db) { toast("claude.ai の中で開くと保存できます"); return Promise.resolve(false); }
    if (S.pending.has(key)) return Promise.resolve(false);
    S.pending.add(key); render();
    return Promise.resolve().then(fn).then(function () {
      if (okMsg) toast(okMsg);
      return true;
    }, function (e) { toast(dbErrorText(e)); return false; }).then(function (ok) {
      S.pending.delete(key); render(); return ok;
    });
  }
  function docRef(path) { return S.db.doc(path); }

  function completeTask(t, card, force) {
    var answer = draft("ans-" + t.id, t.answer).trim();
    var note = draft("note-" + t.id, t.userNote).trim();
    if (t.ask && !answer && !force) { S.confirmEmpty.add(t.id); render(); return; }
    var go = function () {
      write("t:" + t.id, function () {
        return docRef("tasks/" + t.id).update({ status: "done", doneAt: nowIso(), updatedAt: nowIso(), answer: answer, userNote: note });
      }, "完了にしました。Claudeが続きを引き継ぎます").then(function (ok) {
        if (ok) { clearDraft("ans-" + t.id); clearDraft("note-" + t.id); S.expanded.delete(t.id); }
      });
    };
    if (card && !reducedMotion()) {
      var st = h("div", { class: "stamp anim", "aria-hidden": "true" }, "済");
      card.append(st);
      setTimeout(go, 620);
    } else go();
  }
  function snoozeTask(t) {
    write("t:" + t.id, function () {
      return docRef("tasks/" + t.id).update({ status: "snoozed", snoozeUntil: addDays(today(), 1), updatedAt: nowIso(), userNote: draft("note-" + t.id, t.userNote).trim() });
    }, "明日また表示します");
  }
  function chooseTask(t, c, card) {
    var value = c.value != null ? str(c.value) : str(c.label);
    var go = function () {
      write("t:" + t.id, function () {
        return docRef("tasks/" + t.id).update({ status: "done", answer: value, answerLabel: str(c.label || value), doneAt: nowIso(), updatedAt: nowIso() });
      }, "OK！あとはClaudeがやります");
    };
    if (card && !reducedMotion()) {
      card.append(h("div", { class: "stamp anim", "aria-hidden": "true" }, "済"));
      setTimeout(go, 620);
    } else go();
  }
  function skipTask(t) {
    var reason = draft("skip-" + t.id, "").trim();
    write("t:" + t.id, function () {
      return docRef("tasks/" + t.id).update({ status: "skipped", userNote: reason || draft("note-" + t.id, t.userNote).trim(), updatedAt: nowIso() });
    }, "やらないことにしました").then(function (ok) { if (ok) { S.skipAsk.delete(t.id); clearDraft("skip-" + t.id); } });
  }
  function reopenTask(t) {
    write("t:" + t.id, function () {
      return docRef("tasks/" + t.id).update({ status: "todo", updatedAt: nowIso(), processedAt: null });
    }, "未完了に戻しました");
  }
  function saveAnswer(t) {
    var answer = draft("ans-" + t.id, t.answer).trim();
    write("t:" + t.id, function () {
      return docRef("tasks/" + t.id).update({ answer: answer, userNote: draft("note-" + t.id, t.userNote).trim(), updatedAt: nowIso() });
    }, "保存しました");
  }
  function decide(i, status) {
    var note = draft("inote-" + i.id, i.userNote).trim();
    var msg = { approved: "GO！Claudeが次の実行で着手します", rejected: "見送りにしました", paused: "一時停止しました", active: "再開しました" }[status];
    write("i:" + i.id, function () {
      return docRef("ideas/" + i.id).update({ status: status, decidedAt: nowIso(), updatedAt: nowIso(), userNote: note });
    }, msg);
  }
  function saveIdeaNote(i) {
    write("i:" + i.id, function () {
      return docRef("ideas/" + i.id).update({ userNote: draft("inote-" + i.id, i.userNote).trim(), updatedAt: nowIso() });
    }, "メモを保存しました").then(function (ok) { if (ok) S.expanded.delete("inote:" + i.id); });
  }
  function addRevenue() {
    var amount = Math.round(Number(draft("rv-amount", "")));
    var date = draft("rv-date", today());
    if (!(amount > 0)) { toast("金額を入れてください"); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast("日付を選んでください"); return; }
    var source = draft("rv-source", SOURCES[0]);
    var note = draft("rv-note", "").trim();
    write("rv:add", function () {
      return S.db.collection("revenue").add({ date: date, amount: amount, source: source, channel: source, note: note, createdBy: "user", createdAt: nowIso() });
    }, fmtYen(amount) + " を記帳しました").then(function (ok) { if (ok) { clearDraft("rv-amount"); clearDraft("rv-note"); } });
  }
  function deleteRevenue(r) {
    write("rv:" + r.id, function () { return docRef("revenue/" + r.id).delete(); }, "記録を削除しました")
      .then(function (ok) { if (ok) S.expanded.delete("rv:" + r.id); });
  }
  function sendMessage(text, done) {
    text = str(text).trim();
    if (!text) { toast("内容を書いてください"); return; }
    write("msg:add", function () {
      return S.db.collection("messages").add({ text: text, from: "user", status: "new", createdAt: nowIso() });
    }, "送りました。次の実行でClaudeが対応します").then(function (ok) { if (ok && done) done(); });
  }
  function saveProfile() {
    var p = S.profile || {};
    var ids = Object.assign({}, p.ids || {});
    ids.amazonTag = draft("pf-amazon", ids.amazonTag).trim();
    ids.rakutenId = draft("pf-rakuten", ids.rakutenId).trim();
    ids.a8Id = draft("pf-a8", ids.a8Id).trim();
    var next = Object.assign({}, p, {
      weeklyMinutes: Number(draft("pf-minutes", p.weeklyMinutes)) || 0,
      goalMonthly: Number(draft("pf-goal", p.goalMonthly)) || 0,
      interests: draft("pf-interests", p.interests).trim(),
      skills: draft("pf-skills", p.skills).trim(),
      avoid: draft("pf-avoid", p.avoid).trim(),
      contactEmail: draft("pf-email", p.contactEmail).trim(),
      notes: draft("pf-notes", p.notes).trim(),
      autopilot: draft("pf-autopilot", p.autopilot === false ? "0" : "1") === "1",
      ids: ids,
      updatedAt: nowIso()
    });
    write("pf", function () { return docRef("meta/profile").set(next); }, "設定を保存しました").then(function (ok) {
      if (ok) ["pf-amazon", "pf-rakuten", "pf-a8", "pf-minutes", "pf-goal", "pf-interests", "pf-skills", "pf-avoid", "pf-email", "pf-notes", "pf-autopilot"].forEach(clearDraft);
    });
  }

  // ---------- clipboard, files ----------
  function copyText(text, btn, node) {
    try {
      navigator.clipboard.writeText(text).then(function () {
        btn.textContent = "コピー済み"; setTimeout(function () { btn.textContent = "コピー"; }, 1600);
      }, function () { selectNode(node); toast("選択しました。長押しでコピーしてください"); });
    } catch (e) { selectNode(node); toast("選択しました。長押しでコピーしてください"); }
  }
  function selectNode(node) {
    try { var r = document.createRange(); r.selectNodeContents(node); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* ignore */ }
  }
  function saveFile(f) {
    var id = str(f.assetId);
    if (!/^[0-9a-f]{32}$/.test(id)) { toast("ファイルが見つかりません"); return; }
    if (!S.downloads) { toast("この画面では保存できません。claude.ai のアプリかブラウザで開いてください"); return; }
    fetch("/_blob/" + id).then(function (res) {
      if (!res.ok) throw { code: "fetch" };
      return res.blob();
    }).then(function (blob) {
      return S.downloads.save({ filename: f.filename || "file.pdf", data: blob });
    }).then(function () { toast("ファイルを渡しました"); }, function (e) {
      if (e && e.code === "declined") return;
      toast(e && e.code === "fetch" ? "ファイルを読み込めませんでした" : "保存できませんでした");
    });
  }

  // ---------- Claude Code Remote (run now) ----------
  function mcpErrorText(e) {
    var c = e && e.code;
    if (c === "server_not_connected" || c === "server_not_found") return "Claude Code Remote が接続されていません（claude.ai の設定 → コネクタ）。毎日の自動実行はいつもどおり動きます。";
    if (c === "needs_reauth") return "Claude Code Remote の再接続が必要です（claude.ai の設定 → コネクタ）。";
    if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "このアプリからの実行が許可されていません。もう一度押すと許可を求められます。";
    if (c === "blocked_by_policy") return "組織の設定で、この操作は使えません。";
    if (c === "selection_required") return "使う接続先を選んでから、もう一度押してください。";
    if (c === "tool_error") return "起動できませんでした: " + str(e.message).slice(0, 160);
    if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "この画面からは起動できません。毎日の自動実行はいつもどおり動きます。";
    return "接続できませんでした。少し待ってからもう一度お試しください。";
  }
  function runNow() {
    var tid = S.state && S.state.triggerId;
    if (!tid) { S.runMsg = { ok: false, text: "自動実行の設定がまだ届いていません。" }; render(); return; }
    if (!S.mcp) { S.runMsg = { ok: false, text: "この画面からは起動できません。毎日の自動実行はいつもどおり動きます。" }; render(); return; }
    var input = { trigger_id: tid };
    var extra = draft("run-extra", "").trim();
    if (extra) input.text = "オーナーからの追加指示（HQアプリより）: " + extra;
    S.runBusy = true; S.runMsg = null; render();
    S.mcp.callTool(SERVER, "fire_trigger", input).then(function () {
      S.runMsg = { ok: true, text: "Claudeを起動しました。終わるとレポートが届きます（数十分かかることがあります）。" };
      clearDraft("run-extra");
      try { localStorage.setItem("kasegi.lastManual", nowIso()); } catch (e) { /* ignore */ }
    }, function (e) { S.runMsg = { ok: false, text: mcpErrorText(e) }; }).then(function () { S.runBusy = false; render(); });
  }
  function checkSchedule() {
    var tid = S.state && S.state.triggerId;
    if (!tid || !S.mcp) { S.sched = { err: "この画面からは確認できません。" }; render(); return; }
    S.schedBusy = true; render();
    S.mcp.callTool(SERVER, "get_trigger", { trigger_id: tid }).then(function (res) {
      var p = res && res.payload; var t = (p && (p.trigger || p)) || {};
      var last = t.last_run || {};
      S.sched = { next: t.next_run_at, enabled: t.enabled, lastStatus: last.status, lastAt: last.fired_at || last.finished_at };
    }, function (e) { S.sched = { err: mcpErrorText(e) }; }).then(function () { S.schedBusy = false; render(); });
  }

  // ---------- Ask Claude (sample) ----------
  function contextText() {
    var st = revenueStats();

      "収益は保証されません。登録・本人確認・税金の申告など、法律上あなた自身が行う必要があることは、必ずあなたが確認してから進めてください。"));
  }

  var VIEW_FN = { home: viewHome, tasks: viewTasks, ideas: viewIdeas, money: viewMoney, claude: viewClaude };

  // ---------- render ----------
  var raf = 0;
  function render() { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; paint(); }); }
  function paint() {
    var a = document.activeElement, fid = a && a.id, s0 = null, s1 = null;
    try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch (e) { /* ignore */ }
    $("#status").replaceChildren(statusPill());
    document.querySelectorAll(".tab").forEach(function (b) {
      var v = b.getAttribute("data-view");
      b.setAttribute("aria-current", v === S.view ? "page" : "false");
      var n = v === "tasks" ? openTasks().length : v === "ideas" ? S.ideas.filter(function (i) { return i.status === "proposed"; }).length : 0;
      var badge = b.querySelector(".badge");
      badge.hidden = !n; badge.textContent = n > 99 ? "99+" : String(n);
      b.setAttribute("aria-label", b.textContent.replace(/\d+\+?$/, "").trim() + (n ? "（" + n + "件）" : ""));
    });
    var root = $("#view");
    var nodes = VIEW_FN[S.view]();
    root.replaceChildren.apply(root, nodes.filter(Boolean).reduce(function (acc, n) { return acc.concat(n); }, []));
    if (fid) {
      var el = document.getElementById(fid);
      if (el && el !== document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) {
        try { el.focus({ preventScroll: true }); if (s0 != null && el.setSelectionRange) el.setSelectionRange(s0, s1); } catch (e) { /* ignore */ }
      }
    }
  }
  function routeFromHash() {
    var v = (location.hash || "").replace(/^#/, "");
    var next = VIEWS.indexOf(v) >= 0 ? v : "home";
    if (next !== S.view) { S.view = next; window.scrollTo(0, 0); }
    render();
  }

  // ---------- boot ----------
  document.querySelectorAll(".ico").forEach(function (span) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = ICONS[span.getAttribute("data-icon")] || "";
    span.replaceWith(s);
  });
  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { go(b.getAttribute("data-view")); });
  });
  window.addEventListener("hashchange", routeFromHash);
  routeFromHash();

  var C = window.claude;
  if (!C || typeof C.use !== "function") { S.noDb = true; render(); return; }

  var slowTimer = setTimeout(function () { S.slow = true; render(); }, 10000);
  function markLoaded(name, snap) {
    if (snap && snap.metadata && snap.metadata.fromCache && !S.loaded[name]) { render(); return; }
    S.loaded[name] = true;
    if (S.loaded.tasks && S.loaded.state) { S.ready = true; clearTimeout(slowTimer); }
    render();
  }
  function onErr(name) {
    return function (e) {
      clearTimeout(slowTimer);
      S.dbError = (e && e.code === "revoked") ? "アクセス権が変わりました。開き直してください。" : "通信が途切れました。開き直すと再接続します。";
      S.loaded[name] = true; S.ready = true; render();
    };
  }
  function listen(name, query, sortFn) {
    query.onSnapshot(function (snap) {
      var list = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      if (sortFn) list.sort(sortFn);
      S[name] = list;
      markLoaded(name, snap);
    }, onErr(name));
  }

  C.use("db").then(function (db) {
    if (!db) { clearTimeout(slowTimer); S.noDb = true; render(); return; }
    S.db = db;
    try {
      listen("tasks", db.collection("tasks"));
      listen("ideas", db.collection("ideas"));
      listen("revenue", db.collection("revenue"));
      listen("products", db.collection("products"));
      listen("runs", db.collection("runs").orderBy("startedAt", "desc").limit(30));
      listen("messages", db.collection("messages").orderBy("createdAt", "desc").limit(40));
      db.doc("meta/state").onSnapshot(function (s) { S.state = s.exists ? s.data() : null; markLoaded("state", s); }, onErr("state"));
      db.doc("meta/profile").onSnapshot(function (s) { S.profile = s.exists ? s.data() : null; markLoaded("profile", s); }, onErr("profile"));
    } catch (e) {
      S.dbError = "データの読み込みを始められませんでした。"; S.ready = true; render();
    }
  });
  C.use("user").then(function (u) {
    S.user = u;
    if (u) u.isOwner().then(function (v) { S.notOwner = v === false && !!u; render(); });
  });
  C.use("downloads").then(function (d) { S.downloads = d; });
  C.use("sample").then(function (s) { S.sample = s; render(); });
  C.use("mcp").then(function (m) { S.mcp = m; });
})();
</script>
